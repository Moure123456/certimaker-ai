<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertiMaker AI</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px;">
  <h1>مرحباً بك في CertiMaker AI</h1>
  <button id="btn" onclick="login()" style="padding: 12px 24px; font-size: 16px;">تسجيل الدخول عبر Pi</button>
  <p id="status"></p>

  <script>
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true });

    function login() {
      document.getElementById('status').innerText = "جاري الاتصال...";
      Pi.authenticate(['username'], function(p){})
        .then(function(auth) {
          alert("تم الدخول بنجاح: " + auth.user.username);
        })
        .catch(function(err) {
          alert("حدث خطأ: " + err);
        });
    }
  </script>
</body>
</html>
